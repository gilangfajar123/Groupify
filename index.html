<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Groupify - Generator Kelompok</title>

<style>

/* =========================
   RESET
========================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}


/* =========================
   BODY
========================= */

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #7c3aed, transparent 35%),
        radial-gradient(circle at bottom right, #2563eb, transparent 35%),
        #0f172a;

    color: white;
    padding: 30px 15px;
    transition: 0.4s;
}


/* =========================
   CONTAINER
========================= */

.container {
    max-width: 1000px;
    margin: auto;
}


/* =========================
   HEADER
========================= */

.header {
    text-align: center;
    margin-bottom: 30px;
}

.logo {
    width: 75px;
    height: 75px;

    margin: auto;
    margin-bottom: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 35px;

    border-radius: 22px;

    background: rgba(255,255,255,0.15);

    backdrop-filter: blur(15px);

    box-shadow:
        0 10px 30px rgba(0,0,0,0.2);
}

.header h1 {
    font-size: 36px;
    margin-bottom: 8px;
}

.header h1 span {
    color: #a78bfa;
}

.header p {
    color: #cbd5e1;
}


/* =========================
   GLASS CARD
========================= */

.card {
    background: rgba(255,255,255,0.1);

    border: 1px solid rgba(255,255,255,0.15);

    backdrop-filter: blur(20px);

    border-radius: 25px;

    padding: 25px;

    box-shadow:
        0 20px 50px rgba(0,0,0,0.25);
}


/* =========================
   INPUT AREA
========================= */

.input-area {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}

.input-box label {
    display: block;

    margin-bottom: 8px;

    color: #e2e8f0;

    font-size: 14px;

    font-weight: bold;
}

.input-box input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid
        rgba(255,255,255,0.2);

    background:
        rgba(0,0,0,0.2);

    color: white;

    font-size: 16px;

    outline: none;
}

.input-box input:focus {
    border-color: #8b5cf6;

    box-shadow:
        0 0 0 3px
        rgba(139,92,246,0.2);
}


/* =========================
   PILIH KELAS
========================= */

.class-card {
    margin-bottom: 15px;
}

.input-box select {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.2);
    color: white;
    font-size: 16px;
    outline: none;
}

.input-box select option {
    color: #1e293b;
    background: white;
}

/* =========================
   INPUT NAMA
========================= */

.name-area {
    margin-top: 18px;
}

.input-box textarea {
    width: 100%;
    padding: 15px;
    border-radius: 13px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.2);
    color: white;
    font-size: 15px;
    outline: none;
    resize: vertical;
    min-height: 130px;
    line-height: 1.6;
}

.input-box textarea:focus {
    border-color: #8b5cf6;
    box-shadow: 0 0 0 3px rgba(139,92,246,0.2);
}

.name-hint {
    margin-top: 7px;
    color: #94a3b8;
    font-size: 12px;
}

body.light .input-box textarea {
    background: white;
    color: #334155;
    border-color: #cbd5e1;
}

/* =========================
   BUTTON
========================= */

.buttons {
    display: flex;

    gap: 10px;

    margin-top: 20px;
}

button {
    border: none;

    padding: 14px 20px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 15px;

    font-weight: bold;

    transition: 0.25s;
}

button:hover {
    transform: translateY(-2px);
}

.generate {
    flex: 1;

    color: white;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6366f1
        );

    box-shadow:
        0 8px 20px
        rgba(99,102,241,0.3);
}

.random {
    display: none;

    flex: 1;

    color: white;

    background:
        linear-gradient(
            135deg,
            #10b981,
            #059669
        );
}

.copy {
    display: none;

    flex: 1;

    color: white;

    background:
        linear-gradient(
            135deg,
            #f59e0b,
            #ea580c
        );
}

.reset {
    background:
        rgba(255,255,255,0.12);

    color: white;
}


/* =========================
   INFO
========================= */

.info {
    margin-top: 20px;

    text-align: center;

    color: #cbd5e1;

    font-size: 14px;
}


/* =========================
   RESULT
========================= */

#hasil {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(210px, 1fr)
        );

    gap: 18px;

    margin-top: 25px;
}


/* =========================
   GROUP CARD
========================= */

.group {
    position: relative;

    padding: 20px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.09);

    border:
        1px solid
        rgba(255,255,255,0.15);

    overflow: hidden;

    animation:
        muncul 0.5s ease both;
}

.group::before {
    content: "";

    position: absolute;

    width: 100px;
    height: 100px;

    background: #8b5cf6;

    filter: blur(50px);

    opacity: 0.25;

    top: -30px;
    right: -30px;
}

.group h2 {
    position: relative;

    font-size: 19px;

    margin-bottom: 15px;

    color: #c4b5fd;
}

.member {
    position: relative;

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 9px 11px;

    margin-bottom: 7px;

    border-radius: 10px;

    background:
        rgba(255,255,255,0.08);

    color: #f1f5f9;

    font-size: 14px;
}

.number {
    width: 27px;
    height: 27px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(139,92,246,0.25);

    color: #c4b5fd;

    font-size: 12px;

    font-weight: bold;
}

.total {
    margin-top: 12px;

    color: #94a3b8;

    font-size: 12px;
}


/* =========================
   ANIMATION
========================= */

@keyframes muncul {

    from {
        opacity: 0;

        transform:
            translateY(20px)
            scale(0.95);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }

}


/* =========================
   EMPTY
========================= */

.empty {
    grid-column: 1 / -1;

    text-align: center;

    padding: 50px 20px;

    color: #94a3b8;
}

.empty-icon {
    font-size: 50px;

    margin-bottom: 15px;
}


/* =========================
   FOOTER
========================= */

.footer {
    text-align: center;

    margin-top: 25px;

    color: #64748b;

    font-size: 12px;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 650px) {

    body {
        padding: 20px 12px;
    }

    .header h1 {
        font-size: 28px;
    }

    .input-area {
        grid-template-columns: 1fr;
    }

    .buttons {
        flex-direction: column;
    }

    .card {
        padding: 18px;
    }

}


/* =========================
   LIGHT MODE
========================= */

body.light {
    background:
        linear-gradient(
            135deg,
            #e0e7ff,
            #dbeafe
        );

    color: #1e293b;
}

body.light .header p {
    color: #64748b;
}

body.light .card {
    background:
        rgba(255,255,255,0.75);

    border-color:
        rgba(255,255,255,0.8);
}

body.light .input-box label {
    color: #334155;
}

body.light .input-box input {
    background: white;

    color: #334155;

    border-color: #cbd5e1;
}

body.light .info {
    color: #64748b;
}

body.light .group {
    background:
        rgba(255,255,255,0.7);

    border-color:
        rgba(148,163,184,0.3);
}

body.light .member {
    background:
        rgba(226,232,240,0.6);

    color: #334155;
}

body.light .reset {
    color: #334155;

    background:
        rgba(0,0,0,0.08);
}


.manage-names { margin-top:15px; width:100%; color:white; background:rgba(255,255,255,.12); }
.modal { display:none; position:fixed; inset:0; z-index:1000; padding:20px; background:rgba(0,0,0,.65); align-items:center; justify-content:center; }
.modal.show { display:flex; }
.modal-box { width:min(600px,100%); max-height:90vh; overflow-y:auto; background:#172033; border:1px solid rgba(255,255,255,.15); border-radius:22px; padding:22px; box-shadow:0 25px 70px rgba(0,0,0,.45); }
.modal-box h2 { margin-bottom:8px; }
.modal-box p { color:#94a3b8; font-size:13px; margin-bottom:15px; }
#daftarNama { width:100%; min-height:260px; padding:15px; border-radius:13px; border:1px solid rgba(255,255,255,.2); background:rgba(0,0,0,.2); color:white; font-size:15px; outline:none; resize:vertical; line-height:1.6; }
.modal-actions { display:flex; gap:10px; margin-top:15px; }
.modal-actions button { flex:1; }
.save-names { background:linear-gradient(135deg,#8b5cf6,#6366f1); color:white; }
.close-modal { background:rgba(255,255,255,.12); color:white; }
.save-status { margin-top:10px; color:#a7f3d0; font-size:12px; }
body.light .modal-box { background:white; color:#1e293b; }
body.light #daftarNama { background:#f8fafc; color:#334155; border-color:#cbd5e1; }
body.light .close-modal { color:#334155; }

</style>
</head>


<body>


<div class="container">


<!-- HEADER -->

<div class="header">

<div class="logo">
🎲
</div>

<h1>
Group<span>ify</span>
</h1>

<p>
Generator kelompok acak untuk kelasmu
</p>

</div>



<!-- PILIH KELAS -->
<div class="card class-card">
    <div class="input-box">
        <label>🏫 Pilih Kelas</label>
        <select id="pilihKelas" onchange="gantiKelas()">
            <option>XI.1</option><option>XI.2</option><option>XI.3</option>
            <option>XI.4</option><option>XI.5</option><option>XI.6</option>
            <option>XI.7</option><option>XI.8</option><option>XI.9</option>
            <option value="XI.10" selected>XI.10</option>
        </select>
    </div>
</div>

<!-- INPUT CARD -->

<div class="card">


<div class="input-area">


<div class="input-box">

<label>
👨‍🎓 Jumlah Absen
</label>

<input
    type="number"
    id="jumlahSiswa"
    min="1"
    max="200"
    placeholder="Contoh: 32">

</div>


<div class="input-box">

<label>
👥 Jumlah Kelompok
</label>

<input
    type="number"
    id="jumlahKelompok"
    min="1"
    placeholder="Contoh: 6">

</div>


</div>




<button class="manage-names" type="button" onclick="bukaNama()">📝 Kelola Daftar Nama</button>

<!-- BUTTON -->

<div class="buttons">


<button
    class="generate"
    onclick="buatKelompok()">

🎲 Buat Kelompok

</button>


<button
    class="random"
    id="randomButton"
    onclick="buatKelompok()">

🔄 Acak Lagi

</button>


<button
    class="copy"
    id="copyButton"
    onclick="salin()">

📋 Salin

</button>


<button
    class="reset"
    onclick="resetData()">

🗑️ Reset

</button>


</div>


<div
    class="info"
    id="info">

Masukkan jumlah absen dan kelompok
untuk memulai.

</div>


</div>




<div class="modal" id="namaModal">
  <div class="modal-box">
    <h2>📝 Daftar Nama <span id="modalKelas">XI.10</span></h2>
    <p>Satu nama per baris. Daftar akan tersimpan otomatis di perangkat ini.</p>
    <textarea id="daftarNama" placeholder="Satu nama per baris..."></textarea>
    <div class="save-status" id="saveStatus"></div>
    <div class="modal-actions">
      <button class="save-names" type="button" onclick="simpanNama()">💾 Simpan</button>
      <button class="close-modal" type="button" onclick="tutupNama()">Tutup</button>
    </div>
  </div>
</div>

<!-- HASIL -->

<div id="hasil">

<div class="empty">

<div class="empty-icon">
👥
</div>

Belum ada kelompok yang dibuat.

</div>

</div>



<div class="footer">

Groupify • Random Group Generator

</div>


</div>



<script>


let hasilKelompok = [];



const dataKelas = {
  "XI.1": [], "XI.2": [], "XI.3": [], "XI.4": [], "XI.5": [],
  "XI.6": [], "XI.7": [], "XI.8": [], "XI.9": [],
  "XI.10": ["ACHMAD ALDO ARROYAN", "ADINDA BUNGA LESTARI", "AHMAD DICKY RAMADHANI", "BELLINDA MUTIARA OKTADIANTO", "CHARISMA AZZAHRO", "CHICO RENOV PRATAMA", "DZAKYYATUS FIKRYYA", "FARDIEN MUHAMMAD IBRAHIM GHIFARI", "GILANG FAJAR RAMADHAN", "HENGGARUNG TYAS MAHANANI", "ISMA NUR ISTIQOMAH", "JEFFREY ADITYA PRAWIRA", "JENNINE ARISSA ROSADEWI", "KARUNIA MAULUDIAH PRIHATINI", "KEYLA AULIA AZZAHRA", "LEONARD PUTRA SETYONO", "MOCH.OEZIL RAMADHAN", "MOCHAMMAD WAFI ZAINUDIN DAFA", "MOH. GUSTAF ALFI SYAHRI ROMADHON", "MUFASA KEITAMA ILMIAWAN", "MUHAMMAD ADI DWI SAPUTRO", "MUHAMMAD ALFIN ASSHOBRI", "MUHAMMAD ARYA ALAUDDIN", "NUR ALIFATUL RIFAH", "PUTRI AMALIA CANDRA KIRANA", "PUTRI AVRIELIA RAHMA LISTIANGGARA", "RIZQY NAUFALINO HIKAM", "SAPTA BIMA YOGA", "SHERLY APRILIA FERNANDA", "SWARNA DWIPA", "TIARA RIZKY DWI LESTARI", "TSABILA SHALSA LARASATY", "ZUYIYNI I DENAJA GREYSHA"]
};

const STORAGE_KEY = "groupify_daftar_nama_v1";

function semuaNama() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e) { return {}; }
}

function namaKelas(kelas) {
  const saved = semuaNama();
  return Object.prototype.hasOwnProperty.call(saved, kelas)
    ? saved[kelas] : (dataKelas[kelas] || []);
}

function gantiKelas() {
  const kelas = document.getElementById("pilihKelas").value;
  const siswa = namaKelas(kelas);
  document.getElementById("jumlahSiswa").value = siswa.length || "";
  document.getElementById("modalKelas").textContent = kelas;
  document.getElementById("daftarNama").value = siswa.join("\n");
  document.getElementById("saveStatus").textContent =
    siswa.length ? `✓ ${siswa.length} nama tersimpan` : "Belum ada nama tersimpan";
}

function bukaNama() {
  gantiKelas();
  document.getElementById("namaModal").classList.add("show");
  document.getElementById("daftarNama").focus();
}

function tutupNama() {
  document.getElementById("namaModal").classList.remove("show");
}

function simpanNama() {
  const kelas = document.getElementById("pilihKelas").value;
  const nama = document.getElementById("daftarNama").value
    .split(/\r?\n/).map(n => n.trim()).filter(n => n !== "");

  const saved = semuaNama();
  saved[kelas] = nama;
  localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));

  document.getElementById("jumlahSiswa").value = nama.length;
  document.getElementById("saveStatus").textContent =
    `✓ ${nama.length} nama untuk ${kelas} berhasil disimpan`;
}

window.addEventListener("click", e => {
  if (e.target === document.getElementById("namaModal")) tutupNama();
});

/* =========================
   GENERATE
========================= */

function buatKelompok() {

    let jumlahSiswa = Number(
        document.getElementById("jumlahSiswa").value
    );

    let jumlahKelompok = Number(
        document.getElementById("jumlahKelompok").value
    );

    let teksNama = document.getElementById("daftarNama").value.trim();

    // Jika nama diisi, gunakan nama tersebut
    let siswa = [];

    if (teksNama) {
        siswa = teksNama
            .split(/\r?\n/)
            .map(nama => nama.trim())
            .filter(nama => nama !== "");

        jumlahSiswa = siswa.length;

        // Sinkronkan jumlah absen dengan jumlah nama
        document.getElementById("jumlahSiswa").value = jumlahSiswa;
    } else {
        // Jika nama kosong, gunakan nomor absen seperti versi sebelumnya
        if (!jumlahSiswa) {
            alert("Masukkan jumlah absen atau daftar nama siswa!");
            return;
        }

        for (let i = 1; i <= jumlahSiswa; i++) {
            siswa.push("Absen " + i);
        }
    }

    if (!jumlahKelompok) {
        alert("Masukkan jumlah kelompok!");
        return;
    }

    if (jumlahKelompok > jumlahSiswa) {
        alert("Jumlah kelompok tidak boleh lebih banyak dari jumlah siswa!");
        return;
    }

    // Acak nama/absen
    siswa.sort(() => Math.random() - 0.5);

    // Buat kelompok
    hasilKelompok = [];

    for (let i = 0; i < jumlahKelompok; i++) {
        hasilKelompok.push([]);
    }

    // Bagikan secara bergiliran agar jumlah anggota merata
    siswa.forEach((nama, index) => {
        hasilKelompok[index % jumlahKelompok].push(nama);
    });

    tampilkan();
}


/* =========================
   TAMPILKAN
========================= */

function tampilkan() {


let hasil =
    document.getElementById(
        "hasil"
    );


hasil.innerHTML = "";



hasilKelompok.forEach(
    (anggota, index) => {


        let card =
            document.createElement(
                "div"
            );


        card.className = "group";


        let daftar = "";



        anggota.forEach(
            (nama, i) => {

                daftar += `

                <div class="member">

                    <div class="number">
                        ${i + 1}
                    </div>

                    ${nama}

                </div>

                `;

            }
        );



        card.innerHTML = `

        <h2>
            👥 Kelompok ${index + 1}
        </h2>

        ${daftar}

        <div class="total">
            ${anggota.length} anggota
        </div>

        `;



        hasil.appendChild(
            card
        );

    }
);



let jumlah =
    document.getElementById(
        "jumlahSiswa"
    ).value;


let kelompok =
    document.getElementById(
        "jumlahKelompok"
    ).value;



document.getElementById(
    "info"
).innerHTML =

`✨ ${jumlah} absen berhasil
dibagi menjadi ${kelompok} kelompok`;



document.getElementById(
    "randomButton"
).style.display = "block";


document.getElementById(
    "copyButton"
).style.display = "block";

}



/* =========================
   SALIN
========================= */

function salin() {


let teks =
    "HASIL PEMBAGIAN KELOMPOK\n\n";


hasilKelompok.forEach(
    (kelompok, index) => {


        teks +=
            "KELOMPOK " +
            (index + 1) +
            "\n";


        kelompok.forEach(
            (siswa, i) => {

                teks +=
                    (i + 1) +
                    ". " +
                    siswa +
                    "\n";

            }
        );


        teks += "\n";

    }
);



navigator.clipboard
    .writeText(teks)
    .then(() => {

        alert(
            "✅ Hasil berhasil disalin!"
        );

    });

}



/* =========================
   RESET
========================= */

function resetData() {


document.getElementById(
    "jumlahSiswa"
).value = "";


document.getElementById(
    "jumlahKelompok"
).value = "";


document.getElementById(
    "info"
).innerHTML =
"Masukkan jumlah absen dan kelompok untuk memulai.";


document.getElementById(
    "randomButton"
).style.display = "none";


document.getElementById(
    "copyButton"
).style.display = "none";


hasilKelompok = [];


document.getElementById(
    "hasil"
).innerHTML = `

<div class="empty">

<div class="empty-icon">
👥
</div>

Belum ada kelompok yang dibuat.

</div>

`;

}



// Muat daftar kelas saat aplikasi dibuka.
gantiKelas();


gantiKelas();
</script>


</body>
</html>
